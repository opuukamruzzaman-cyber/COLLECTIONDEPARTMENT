<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেমেন্ট মেথড সিলেক্ট করুন</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .payment-card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }
    .card-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    select:focus, input[type="text"]:focus {
      border-color: #e2136e;
    }
    .info-box {
      background-color: #fff4f8;
      border-left: 4px solid #e2136e;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #444;
      line-height: 1.5;
    }
    .btn-submit {
      width: 100%;
      background-color: #e2136e;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-submit:hover {
      background-color: #c20d5d;
    }
    .error-msg {
      color: #d9534f;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }
    .success-card {
      display: none;
      text-align: center;
      padding: 10px;
    }
    .success-card h3 {
      color: #28a745;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="payment-card">
  <div id="payment-form-container">
    <h2 class="card-title">পেমেন্ট কনফার্ম করুন</h2>
    
    <form id="paymentForm">
      <!-- Payment Method Selection -->
      <div class="form-group">
        <label for="paymentMethod">পেমেন্ট মেথড নির্বাচন করুন</label>
        <select id="paymentMethod" onchange="updateTrxLength()">
          <option value="bkash">bKash (বিকাশ)</option>
          <option value="nagad">Nagad (নগদ)</option>
        </select>
      </div>

      <!-- Information Instructions -->
      <div class="info-box" id="infoBox">
        বিকাশ ক্যাশআউট / সেন্ড মানি করার পর প্রাপ্ত <strong>১০ ডিজিটের</strong> Transaction ID (TrxID) নিচে প্রদান করুন।
      </div>

      <!-- Transaction ID Input -->
      <div class="form-group">
        <label for="trxId">ট্রানজেকশন আইডি (TrxID)</label>
        <input 
          type="text" 
          id="trxId" 
          placeholder="যেমন: 9A8B7C6D5E" 
          maxlength="10" 
          required
        >
        <div class="error-msg" id="errorMsg">সঠিক ট্রানজেকশন আইডি প্রদান করুন।</div>
      </div>

      <button type="submit" class="btn-submit">পেমেন্ট নিশ্চিত করুন</button>
    </form>
  </div>

  <!-- Success Message (Matches original flow) -->
  <div id="successCard" class="success-card">
    <h3>ধন্যবাদ!</h3>
    <p>আপনার পেমেন্ট রিকোয়েস্ট সফলভাবে গ্রহণ করা হয়েছে।</p>
  </div>
</div>

<script>
  function updateTrxLength() {
    const method = document.getElementById('paymentMethod').value;
    const trxInput = document.getElementById('trxId');
    const infoBox = document.getElementById('infoBox');
    const errorMsg = document.getElementById('errorMsg');
    
    trxInput.value = ''; // Reset input value on method change
    errorMsg.style.display = 'none';

    if (method === 'bkash') {
      trxInput.maxLength = 10;
      trxInput.placeholder = "যেমন: 9A8B7C6D5E";
      infoBox.innerHTML = "বিকাশ ক্যাশআউট / সেন্ড মানি করার পর প্রাপ্ত <strong>১০ ডিজিটের</strong> Transaction ID (TrxID) নিচে প্রদান করুন।";
    } else if (method === 'nagad') {
      trxInput.maxLength = 8;
      trxInput.placeholder = "যেমন: 7A8B9C0D";
      infoBox.innerHTML = "নগদ ক্যাশআউট / সেন্ড মানি করার পর প্রাপ্ত <strong>৮ ডিজিটের</strong> Transaction ID (TrxID) নিচে প্রদান করুন।";
    }
  }

  document.getElementById('paymentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const method = document.getElementById('paymentMethod').value;
    const trxId = document.getElementById('trxId').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    let isValid = false;

    // Validation Check based on selected method
    if (method === 'bkash' && trxId.length === 10) {
      isValid = true;
    } else if (method === 'nagad' && trxId.length === 8) {
      isValid = true;
    }

    if (isValid) {
      errorMsg.style.display = 'none';
      // Confirmation behavior
      document.getElementById('payment-form-container').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';
    } else {
      if (method === 'bkash') {
        errorMsg.innerText = "বিকাশের ট্রানজেকশন আইডি অবশ্যই ১০ ডিজিটের হতে হবে।";
      } else {
        errorMsg.innerText = "নগদের ট্রানজেকশন আইডি অবশ্যই ৮ ডিজিটের হতে হবে।";
      }
      errorMsg.style.display = 'block';
    }
  });
</script>

</body>
</html>
